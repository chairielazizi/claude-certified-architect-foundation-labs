# Alternative: the official GitHub Action. It installs Claude Code, runs it non-interactively, and
# provides an inline-comment MCP tool that only starts when --allowedTools names it.
# Use this when you want Claude to post its own comments; use claude-pr-review.yml when you want a
# schema-validated JSON result that your own step turns into comments (deduplication, gating, metrics).
name: Claude PR review (action)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the review criteria in CLAUDE.md.
            Read the existing review comments first (gh pr view --comments) and do not repeat an issue
            that is already reported and still unaddressed; reply to it only if it got worse.
            Post each new finding as an inline comment on the changed line, with severity and a concrete fix.
          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
